name: Build & Release NavigatoreOSM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione Release (es. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-ios:
    name: Build iOS (armv7 32-bit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compilazione NavigatoreOSM (IPA & DEB) con Theos Docker
        run: |
          chmod +x package-ipa.sh
          ./package-ipa.sh
          docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project cauan/theos make package DEBUG=0 messages=no

      - name: Genera Indici Repository Cydia
        run: |
          mkdir -p cydia_repo/debs
          cp packages/*.deb cydia_repo/debs/
          chmod +x cydia_repo/update-repo.py
          python3 cydia_repo/update-repo.py

      - name: Upload Artifacts iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-binaries
          path: |
            NavigatoreOSM.ipa
            packages/*.deb
            cydia_repo/

  build-android:
    name: Build Android (GPSTether APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compila APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../GPSTether.apk

      - name: Upload Artifact Android
        uses: actions/upload-artifact@v4
        with:
          name: android-binary
          path: GPSTether.apk

  publish-release:
    name: Pubblica GitHub Release
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scarica Artifacts iOS
        uses: actions/download-artifact@v4
        with:
          name: ios-binaries

      - name: Scarica Artifact Android
        uses: actions/download-artifact@v4
        with:
          name: android-binary

      - name: Determina Versione Release
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Crea GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: Release ${{ steps.get_version.outputs.TAG }}
          body: |
            ## 🗺️ NavigatorOSM - Release ${{ steps.get_version.outputs.TAG }}
            
            Pure native GPS navigation engine retrofitted for legacy Apple iPads (iPad Mini 1st Gen, iPad 2, iPad 3, iPad 4) running iOS 9.3.5 (32-bit armv7) + Android GPS Tethering Companion.

            ---

            ### 📲 Wireless Over-The-Air Installation (Cydia)
            1. Open **Cydia** on your jailbroken iPad Mini.
            2. Navigate to **Sources** ➔ **Edit** ➔ **Add**.
            3. Enter the official repository URL:
               `https://vibe-maribit.github.io/NavigatorOSM/`
            4. Cydia will index **NavigatorOSM** with full icon support, ready for 1-tap installation and wireless updates!

            ---

            ### 📦 Included Release Binaries
            - `NavigatoreOSM.ipa`: Standalone iOS app bundle for 1-command USB installation via `./install-usb.sh`, `ideviceinstaller`, or Sideloadly.
            - `com.nicola.navigatoreosm_*.deb`: Native Debian Cydia package for offline installation via Filza or DPKG.
            - `GPSTether.apk`: Android companion app to broadcast satellite GPS coordinates over Wi-Fi hotspot to Wi-Fi-only iPads.

            ---

            ### 🛰️ Android GPS Tethering Quick Setup
            1. Install `GPSTether.apk` on your Android smartphone.
            2. Enable your phone's **Wi-Fi Hotspot** and connect the iPad to it.
            3. Open **GPS Tether** on Android and tap **▶ START TETHERING**.
            4. Launch **NavigatorOSM** on the iPad: the speedometer and map will immediately lock onto your smartphone's high-accuracy GPS fix!
          files: |
            NavigatoreOSM.ipa
            packages/*.deb
            GPSTether.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-cydia-pages:
    name: Deploy Cydia Repo su GitHub Pages
    needs: [build-ios, publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Scarica Artifacts iOS
        uses: actions/download-artifact@v4
        with:
          name: ios-binaries

      - name: Deploy su branch gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cydia_repo
          publish_branch: gh-pages
          force_orphan: false
